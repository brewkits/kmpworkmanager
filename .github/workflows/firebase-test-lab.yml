name: Firebase Test Lab (real devices)

# ── Manual setup required before this workflow can run ────────────────────
# 1. Create a Firebase project (or reuse an existing GCP project) and enable
#    the Blaze (pay-as-you-go) billing plan — Test Lab requires it for any
#    usage beyond the free per-day quota.
# 2. Create a service account with the "Firebase Test Lab Admin" role (or an
#    equivalent custom role with `firebase.testlab.*` + `cloudtestservice.*`
#    permissions), and download its JSON key.
# 3. Add the JSON key as a GitHub Actions secret named
#    FIREBASE_SERVICE_ACCOUNT_JSON on this repo (Settings → Secrets and
#    variables → Actions).
#
# Until that secret exists, the `firebase-test-lab` job below is skipped
# (gated via the `check-secret` job's output — a job-level `if:` cannot
# reference `secrets.*` directly, so the check has to happen in its own job
# first) — it will NOT fail CI, and it will NOT incur any Firebase/GCP cost.
# This is intentional: this workflow was added ahead of the Firebase project
# being provisioned, so it must be a safe no-op until someone completes the
# 3 steps above.
#
# Device matrix is deliberately small — each physical-device
# minute is billed once the free daily quota (30 min/day on Blaze) is used,
# and this workflow runs on every tag push, not gated behind manual approval.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-secret:
    name: Check Firebase secret is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SECRET_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: echo "configured=${{ env.SECRET_VALUE != '' }}" >> "$GITHUB_OUTPUT"

  firebase-test-lab:
    name: Instrumented tests on real devices
    needs: check-secret
    if: needs.check-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew

      - name: Build debug APK + debug instrumentation APK
        run: >-
          ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest
          :kmpworker:assembleDebugAndroidTest

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # The library's own instrumented tests, which are what actually ships. This ran only
      # the demo's UI tests until v3.5.0 — the device farm was exercising the sample app and
      # not the artifact users depend on.
      #
      # :kmpworker is an Android library, so its androidTest APK is self-instrumenting: the
      # same file is passed as --app and --test. There is no separate app under test.
      #
      # F01L at API 27 is deliberate and is the reason this job earns its cost. minSdk is 26,
      # and nothing else in CI runs anywhere near it — the local devices and the rest of the
      # matrix are all API 30+. If a call needs an API level the library claims to support and
      # does not have, this is the only place it shows up before a user finds it.
      - name: Run library instrumentation tests on Firebase Test Lab
        run: >-
          gcloud firebase test android run
          --type instrumentation
          --app kmpworker/build/outputs/apk/androidTest/debug/kmpworker-debug-androidTest.apk
          --test kmpworker/build/outputs/apk/androidTest/debug/kmpworker-debug-androidTest.apk
          --device model=F01L,version=27,locale=en,orientation=portrait
          --device model=oriole,version=33,locale=en,orientation=portrait
          --timeout 20m

      - name: Run demo UI tests on Firebase Test Lab
        run: >-
          gcloud firebase test android run
          --type instrumentation
          --app composeApp/build/outputs/apk/debug/composeApp-debug.apk
          --test composeApp/build/outputs/apk/androidTest/debug/composeApp-debug-androidTest.apk
          --device model=redfin,version=30,locale=en,orientation=portrait
          --device model=oriole,version=33,locale=en,orientation=portrait
          --timeout 15m

      - name: Upload Test Lab results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-results
          path: |
            composeApp/build/outputs/apk/debug/
            composeApp/build/outputs/apk/androidTest/
          retention-days: 7
